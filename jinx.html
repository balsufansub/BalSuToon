<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jinx - Balsutoon</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #09090d;
  color: #fff;
  font-family: Arial, sans-serif;
}


/* HEADER */

header {
  height: 70px;
  background: #111116;
  border-bottom: 1px solid #292932;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 6%;

  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  color: #ff4fa3;
  font-size: 27px;
  font-weight: 900;
  text-decoration: none;
}

.back {
  color: #ddd;
  text-decoration: none;
  font-size: 14px;
}

.back:hover {
  color: #ff4fa3;
}


/* SERIES */

.series {
  max-width: 1100px;
  margin: auto;

  padding: 60px 6%;

  display: grid;
  grid-template-columns: 260px 1fr;

  gap: 45px;
}


/* COVER */

.cover {
  width: 260px;
  height: 370px;

  background: #15151b;

  border: 2px solid #ff4fa3;

  border-radius: 14px;

  overflow: hidden;

  box-shadow: 0 20px 60px rgba(255,79,163,.15);
}

.cover img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}


/* INFO */

.label {
  color: #ffd43b;

  font-size: 12px;

  letter-spacing: 2px;

  font-weight: bold;

  margin-bottom: 12px;
}

h1 {
  font-size: 48px;

  margin-bottom: 15px;
}

.description {
  color: #aaa;

  line-height: 1.7;

  margin-bottom: 25px;

  max-width: 600px;
}

.tags {
  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-bottom: 25px;
}

.tag {
  background: #1b1b22;

  border: 1px solid #30303a;

  padding: 7px 11px;

  border-radius: 6px;

  color: #bbb;

  font-size: 12px;
}

.rating {
  color: #ffd43b;

  font-weight: bold;

  margin-bottom: 25px;
}


/* CHAPTERS */

.section {
  max-width: 1100px;

  margin: auto;

  padding: 0 6% 60px;
}

.section h2 {
  font-size: 23px;

  margin-bottom: 20px;
}

.chapter-list {
  display: flex;

  flex-direction: column;

  gap: 10px;
}

.chapter {
  background: #15151b;

  border: 1px solid #26262e;

  border-radius: 9px;

  padding: 17px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  text-decoration: none;

  color: white;

  transition: .2s;
}

.chapter:hover {
  border-color: #ff4fa3;

  transform: translateX(4px);
}

.chapter-number {
  color: #ffd43b;

  font-weight: bold;
}

.chapter-title {
  color: #ddd;
}


/* FOOTER */

footer {
  padding: 30px;

  text-align: center;

  background: #111116;

  border-top: 1px solid #292932;

  color: #777;

  font-size: 13px;
}


/* MOBILE */

@media (max-width: 700px) {

  .series {
    grid-template-columns: 1fr;

    justify-items: center;

    text-align: center;
  }

  .cover {
    width: 210px;

    height: 300px;
  }

  h1 {
    font-size: 38px;
  }

  .tags {
    justify-content: center;
  }

}

</style>

</head>


<body>


<header>

  <a href="index.html" class="logo">
    BALSUTOON
  </a>

  <a href="index.html" class="back">
    ← Ana Sayfa
  </a>

</header>


<section class="series">


  <div class="cover">

    <img src="IMG_8187.jpeg" alt="Jinx">

  </div>


  <div>

    <div class="label">
      ÖNE ÇIKAN SERİ
    </div>

    <h1>
      Jinx
    </h1>

    <div class="rating">
      ⭐ 9.5
    </div>

    <p class="description">
      Jinx serisinin bölümlerini Balsutoon üzerinden takip edebilirsin.
      Yeni bölümler eklendikçe burada listelenecek.
    </p>


    <div class="tags">

      <span class="tag">BL</span>
      <span class="tag">Romantik</span>
      <span class="tag">Dram</span>
      <span class="tag">Webtoon</span>

    </div>

  </div>

</section>


<section class="section">

  <h2>
    📖 Bölümler
  </h2>


  <div class="chapter-list">


    <a href="jinx1.html" class="chapter">

      <span class="chapter-title">
        Jinx - Bölüm 1
      </span>

      <span class="chapter-number">
        Bölüm 1 →
      </span>

    </a>


  </div>

</section>


<footer>

  © 2026 Balsutoon

</footer>


</body>
</html>
